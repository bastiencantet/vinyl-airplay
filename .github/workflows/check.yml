name: Community checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: node --check web/app.js
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m pip install -r tests/requirements.txt
      - run: python tests/mock_homepods.py target/debug/vinyl-airplay
      - if: runner.os == 'Linux'
        run: python tests/mock_activity.py target/debug/vinyl-airplay
      - run: python tests/mock_volume.py target/debug/vinyl-airplay
      - if: runner.os == 'Linux'
        run: python tests/mock_recognition.py target/debug/vinyl-airplay
      - if: runner.os == 'Linux'
        run: python tests/mock_control.py target/debug/vinyl-control
      - run: cargo check --locked --manifest-path tools/shazam-fingerprint/Cargo.toml
