name: Desktop checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb,appimage
          - os: macos-latest
            platform: macos-arm64
            bundles: app,dmg
          - os: macos-15-intel
            platform: macos-x64
            bundles: app,dmg
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: desktop-cargo-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: desktop-cargo-${{ matrix.platform }}-
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - run: node scripts/check-desktop-version.mjs
      - run: node scripts/prepare-desktop.mjs --debug
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: node scripts/prepare-desktop.mjs
      - run: npx tauri build --bundles ${{ matrix.bundles }} --ci
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          package=(target/release/bundle/deb/*.deb)
          dpkg-deb -f "${package[0]}" Depends | grep -q libasound2
          dpkg-deb -c "${package[0]}" > /tmp/vinyl-package-files.txt
          for binary in vinyl-airplay-desktop vinyl-airplay vinyl-shazam-fingerprint; do
            grep -Eq "[[:space:]](\./)?usr/bin/$binary$" /tmp/vinyl-package-files.txt
          done
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict "target/release/bundle/macos/Vinyl AirPlay.app"
          for image in target/release/bundle/dmg/Vinyl\ AirPlay_*.dmg; do hdiutil verify "$image"; done
      - run: node scripts/collect-desktop.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: vinyl-airplay-${{ matrix.platform }}-alpha
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 30
