[package]
name = "vinyl-airplay"
version = "0.1.0"
license = "GPL-3.0-or-later"
authors = ["Bastien Cantet and contributors"]
readme = "README.md"
repository = "https://github.com/bastiencantet/vinyl-airplay"
edition = "2024"
default-run = "vinyl-airplay"
description = "Experimental native Rust AirPlay sender for live vinyl audio and HomePod research"

[features]
default = ["native-audio"]
native-audio = ["dep:cpal", "dep:rtrb", "dep:rubato", "dep:audioadapter-buffers"]

[dependencies]
audioadapter-buffers = { version = "5.1", optional = true }
rtrb = { version = "0.4", optional = true }
rubato = { version = "5.1", default-features = false, optional = true }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
hkdf = "0.12"
mdns-sd = "0.21"
num-bigint = "0.4"
plist = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
srp = "0.6"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "signal", "sync", "process"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
cpal = { version = "0.18.2", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
